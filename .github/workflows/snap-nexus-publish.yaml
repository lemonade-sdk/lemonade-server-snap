name: Snap Nexus Preview Publish

on:
  schedule:
    - cron: '0 0,6,12,18 * * *'  # Run 4 times a day (every 6 hours UTC)
  workflow_dispatch:  # Allow manual trigger

jobs:
  build-and-publish:
    strategy:
      matrix:
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        fetch-tags: true
    - name: Pin lemonade-server source to geramy/nexus-integration-main branch
      run: |
        # Add source-branch attribute so snapcraft checks out geramy/nexus-integration-main
        sed -i '/source: https:\/\/github\.com\/lemonade-sdk\/lemonade\.git$/a\    source-branch: geramy/nexus-integration-main' snap/snapcraft.yaml
        grep -A2 'source:' snap/snapcraft.yaml | head -6
    - name: Set nexus snap version
      run: |
        set -eu
        # Snap versions are limited to 32 chars, so use nexus-<date>-<sha> instead of git describe
        DESCRIBE_LINE='        VERSION=$(git describe --tags --abbrev=10)'
        if ! grep -qF "$DESCRIBE_LINE" snap/snapcraft.yaml; then
          echo "Could not find version fallback line in snap/snapcraft.yaml" >&2
          exit 1
        fi
        sed -i "s|^${DESCRIBE_LINE}\$|        VERSION=nexus-\$(date -u +%Y%m%d)-\$(git rev-parse --short=10 HEAD)|" snap/snapcraft.yaml
        grep -n 'VERSION=' snap/snapcraft.yaml
    - uses: canonical/action-build@v1.3.0
      id: build
    - uses: snapcore/action-publish@v1
      env:
        SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.STORE_LOGIN }}
      with:
        snap: ${{ steps.build.outputs.snap }}
        release: latest/stable/preview-nexus
