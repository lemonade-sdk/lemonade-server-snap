name: lemonade-server
base: core24
summary: Local AI server with OpenAI-compatible API
title: Lemonade Server
description: |
  Lemonade Server is a lightweight, high-performance local AI inference server
  that provides an OpenAI-compatible API for running large language models on
  your own hardware.

  **Features:**
  - OpenAI-compatible REST API (chat completions, embeddings, etc.)
  - Multiple backend support: Vulkan, ROCm (AMD GPUs), and CPU
  - Automatic model management and caching
  - Support for GGUF models from Hugging Face
  - Low latency local inference
  - Runs as a background service

  **Supported Hardware:**
  - AMD GPUs: RDNA3 (RX 7000), RDNA4 (RX 9000), Strix Point/Halo APUs
  - Any Vulkan-capable GPU
  - CPU fallback for systems without GPU acceleration

  **Quick Start:**
  The server starts automatically after installation. Access the API at:
  http://localhost:13305/api/v1

  **Documentation:** https://lemonade-server.ai/

adopt-info: lemonade-server
grade: stable
confinement: strict
license: Apache-2.0

website: https://lemonade-server.ai
source-code: https://github.com/lemonade-sdk/lemonade
issues: https://github.com/lemonade-sdk/lemonade-server-snap/issues
contact: https://github.com/lemonade-sdk/lemonade-server-snap/issues

platforms:
  amd64:
  arm64:

layout:
  /usr/include:
    bind: $SNAP/usr/include
  /usr/share/lemonade-server:
    symlink: $SNAP/usr/share/lemonade-server
  # Node.js externalizes some builtins to /usr/share/nodejs at a hardcoded path.
  # Bind the snap's copy so node can find them at runtime.
  /usr/share/nodejs:
    bind: $SNAP/usr/share/nodejs
  # crt startup/termination objects needed by Triton JIT (ROCm clang passes
  # them as absolute paths to ld.lld, so they must exist at the system path).
  /usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/crti.o:
    bind-file: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/crti.o
  /usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/crtn.o:
    bind-file: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/crtn.o
  # libc.so is a linker script that references libc_nonshared.a by absolute path.
  /usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libc_nonshared.a:
    bind-file: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libc_nonshared.a
plugs:
  gpu-2404:
    interface: content
    target: $SNAP/gpu-2404
    default-provider: mesa-2404
  shared-memory:
    interface: shared-memory
    private: true
slots:
  # Adds a pseudo content interface to allow clients to express their
  # runtime dependency on lemonade-server
  lemonade-server:
    interface: content
    content: foo
    read:
      - $SNAP/meta/snap.yaml

apps:
  lemonade-server:
    command: usr/bin/lemonade
    command-chain: [bin/gpu-2404-wrapper]
    plugs:
      - accel
      - home
      - removable-media
      - network
      - network-bind
      - opengl
      - gpu-2404
      - hardware-observe
      - system-observe
      - shared-memory
    environment:
      LD_LIBRARY_PATH: "$SNAP/usr/share/lemonade-server:$SNAP_COMMON/cache/lemonade/bin/llamacpp/vulkan:$SNAP_COMMON/cache/lemonade/bin/whispercpp/vulkan:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR:$SNAP/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR:/var/lib/snapd/lib/gl${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
      LIBRARY_PATH: "$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR"
      PATH: "$SNAP/usr/bin:$SNAP_USER_COMMON/tools/bin:$PATH"
      HOME: "$SNAP_COMMON"
      LEMONADE_CACHE_DIR: "$SNAP_COMMON/cache/lemonade"
  daemon:
    command: usr/bin/lemond
    command-chain: [bin/gpu-2404-wrapper]
    daemon: simple
    install-mode: enable
    restart-condition: on-failure
    refresh-mode: restart
    plugs:
      - accel
      - home
      - removable-media
      - network
      - network-bind
      - opengl
      - gpu-2404
      - process-control
      - hardware-observe
      - system-observe
      - shared-memory
    environment:
      LD_LIBRARY_PATH: "$SNAP/usr/share/lemonade-server:$SNAP_COMMON/cache/lemonade/bin/llamacpp/vulkan:$SNAP_COMMON/cache/lemonade/bin/whispercpp/vulkan:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR:$SNAP/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR:/var/lib/snapd/lib/gl${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
      LIBRARY_PATH: "$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR"
      PATH: "$SNAP/usr/bin:$PATH"
      HOME: "$SNAP_COMMON"
      # System daemons run via systemd with no user session, so snapd does not
      # set XDG_RUNTIME_DIR. lemond's get_runtime_dir() requires it to point at
      # an existing, writable directory (it only creates a "lemonade" subdir
      # inside it), so point it at the snap's always-present writable common dir.
      XDG_RUNTIME_DIR: "$SNAP_COMMON"
      LEMONADE_CACHE_DIR: "$SNAP_COMMON/cache/lemonade"
      LEMONADE_DISABLE_SYSTEMD_JOURNAL: 1
      #FLM_CONFIG_PATH: "$SNAP_COMMON/cache/lemonade/bin/flm/npu/model_list.json"

parts:
  deps:
    plugin: nil
    build-packages:
      - curl
      - libnode-dev
    stage-packages:
      - libgomp1
      - libatomic1
      - libcurl4t64
      - libfftw3-single3
      - libwebsockets19t64
      - curl
      - nodejs # for running @anthropic-ai/claude-code cli.js when auto-downloaded
      - node-cjs-module-lexer # nodejs externalized builtin
      - node-undici # nodejs externalized builtin
      - node-acorn # nodejs externalized builtins (acorn + acorn-walk)
      - unzip # For extracting backends at runtime
      - libdrm-amdgpu1 # SD backends need this at runtime
      - libnuma1 # SD backends need this at runtime
      - libnode109
      - xz-utils
      - to amd64:
        - libc6-dev # C headers (stdlib.h etc.) needed by ROCm bundled clang for Triton JIT
        - linux-libc-dev # Linux kernel headers needed by HIP runtime
        - binutils # Provides ld linker for Triton JIT compilation
        - lld # Provides ld.lld for ROCm bundled clang to use as linker
        - libgcc-s1 # Provides libgcc_s.so.1; we create the unversioned linker stub below
    override-prime: |
      craftctl default
      ln -sf libgcc_s.so.1 $CRAFT_PRIME/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libgcc_s.so
    override-build: |
      set +u # For unbound variables
      # workaround for build.snapcraft.io builds
      # https://bugs.launchpad.net/bugs/1886861
      if [ -n "$http_proxy" ]; then
        export ELECTRON_GET_USE_PROXY=1
        export GLOBAL_AGENT_HTTP_PROXY="${http_proxy}"
        export GLOBAL_AGENT_HTTPS_PROXY="${http_proxy}"
      fi
      craftctl default

  lemonade-server:
    plugin: cmake
    source: https://github.com/lemonade-sdk/lemonade.git
    source-tag: v10.9.0
    cmake-parameters:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_PREFIX_PATH=/usr
      - -DCMAKE_INSTALL_PREFIX=/usr
      - -DBUILD_WEB_APP=ON
    build-snaps:
      - node/22/stable
    build-packages:
      - build-essential
      - g++
      - cmake
      - git
      - curl
      - libcurl4-openssl-dev
      - libwebsockets-dev
      - libssl-dev
      - zlib1g-dev
      - pkg-config
      - ninja-build
      - libdrm-dev
    override-pull: |
      craftctl default
      VERSION=$(craftctl get version)
      if [ -z $VERSION ]; then
        VERSION=$(git describe --tags --abbrev=10)
        craftctl set version=$VERSION
      fi
    override-build: |
      export PATH="/snap/node/current/bin:$PATH"
      craftctl default

  gpu-snap:
    after: [lemonade-server, deps]
    source: https://github.com/canonical/gpu-snap.git
    plugin: dump
    override-prime: |
      craftctl default
      ${CRAFT_PART_SRC}/bin/gpu-2404-cleanup mesa-2404
    prime:
      - bin/gpu-2404-wrapper
  
  scripts:
    plugin: dump
    source: scripts/
    organize:
      claude: usr/bin/claude
      codex: usr/bin/codex
    override-prime: |
      craftctl default
      chmod +x $CRAFT_PRIME/usr/bin/claude
      chmod +x $CRAFT_PRIME/usr/bin/codex

  tools:
    plugin: nil
    stage-packages:
      - gh
      - git
      - jq
      - make
      - patch
      - ripgrep
