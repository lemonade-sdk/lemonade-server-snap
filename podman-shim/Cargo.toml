[package]
name = "podman"
version = "0.1.0"
edition = "2021"
description = "Minimal podman stand-in that runs OCI images inside the lemonade-server snap sandbox"
license = "Apache-2.0"

[dependencies]
flate2 = "1"
libc = "0.2"
serde_json = "1"
sha2 = "0.10"
tar = { version = "0.4", default-features = false }
ureq = { version = "2", default-features = false, features = ["tls"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
